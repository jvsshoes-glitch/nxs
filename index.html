<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>NXS</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f4f6;color:#111827;font-family:'Segoe UI',Arial,sans-serif;padding:16px}
.c{width:100%;max-width:360px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px;text-align:center}h1{margin:0 0 8px;font-size:22px}p{margin:0;color:#4b5563;font-size:14px;line-height:1.45}
.s{width:26px;height:26px;margin:0 auto 16px;border:3px solid #e5e7eb;border-top-color:#111827;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="c"><div class="s"></div><h1>NXS</h1><p id="m">Abrindo o sistema…</p></main>
<script>
(function () {
  var msg = document.getElementById('m'), tries = 0
  var phone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
  function again() {
    tries++
    if (tries > 2) msg.textContent = 'O sistema está reiniciando ou o computador servidor está desligado. Esta página tenta de novo sozinha.'
    setTimeout(go, 5000)
  }
  function go() {
    fetch('address.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json() }).then(function (j) {
      var url = String(j.url || '')
      if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) return again()
      var img = new Image()
      img.onload = function () { location.replace(url + (phone ? '/celular' : '/')) }
      img.onerror = again
      img.src = url + '/celular-192.png?t=' + Date.now()
    }).catch(again)
  }
  go()
})()
</script>
</body>
</html>
